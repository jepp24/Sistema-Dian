name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Create build directory
      run: mkdir -p "sistema Dian/dist"
    
    - name: Create HTML
      run: |
        cat > "sistema Dian/dist/index.html" << 'ENDHTML'
<!DOCTYPE html>
<html>
<head>
    <title>Sistema DIAN</title>
    <style>
        body { font-family: Arial; background: #f5f5f5; }
        .container { max-width: 600px; margin: 50px auto; background: white; padding: 30px; border-radius: 8px; }
        h1 { color: #333; }
        .success { color: green; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 Sistema DIAN</h1>
        <p class="success">✅ Desplegado en GitHub Pages</p>
        <p>URL: <a href="https://jepp24.github.io/Sistema-Dian/">https://jepp24.github.io/Sistema-Dian/</a></p>
    </div>
</body>
</html>
ENDHTML
    
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v2
      with:
        path: 'sistema Dian/dist'
    
    - name: Deploy
      uses: actions/deploy-pages@v2
